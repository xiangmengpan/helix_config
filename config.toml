theme = "dark_plus"

[editor]
line-number = "relative"
text-width = 80
auto-info = false
true-color = true
color-modes = true
auto-completion = false
auto-format = false
cursorline = true
completion-replace = true
bufferline = "multiple"
# end-of-line-diagnostics = "disable"


[editor.file-picker]
max-depth = 6

[editor.cursor-shape]
insert = "bar"
normal = "block"
select = "underline"

[editor.soft-wrap]
enable = true
max-wrap = 25 # increase value to reduce forced mid-word wrapping
max-indent-retain = 0

[editor.indent-guides]
render = true
character = "╎" # Some characters that work well: "▏", "┆", "┊", "⸽"
skip-levels = 1

[editor.statusline]
left = ["mode", "spinner","file-base-name"]
center = []
right = ["diagnostics", "selections", "position", "file-encoding", "file-line-ending", "file-type"]
separator = "│"

[editor.inline-diagnostics]
cursor-line = "info"

[editor.lsp]
display-signature-help-docs = false

[keys.normal]
C-j = "save_selection"
C-s = ":w" 
A-S-f = ":fmt"
A-h = ":toggle lsp.display-inlay-hints"

[keys.insert]
C-s = ":w" 
A-S-f = ":fmt"
A-h = ":toggle lsp.display-inlay-hints"
